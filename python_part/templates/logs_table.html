<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audit Logs</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f6f8fa; }
    h1 { text-align:center; }
    table { border-collapse: collapse; margin: 20px auto; width: 95%; background:white; }
    th, td { border: 1px solid #ddd; padding: 8px; font-size: 14px; }
    th { background:#24292f; color:white; text-align:left; }
    tr:nth-child(even) { background:#f9f9f9; }
    tr:hover { background:#eef; }
    .mono { font-family: "Consolas", monospace; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Audit Logs</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Request ID</th>
        <th>Path</th>
        <th>Method</th>
        <th>Duration (ms)</th>
        <th>Timestamp</th>
        <th>Snippet</th>
      </tr>
    </thead>
    <tbody>
      {% for r in rows %}
      <tr>
        <td>{{ r.id }}</td>
        <td class="mono">{{ r.request_id }}</td>
        <td>{{ r.path }}</td>
        <td>{{ r.method }}</td>
        <td>{{ r.duration_ms }}</td>
        <td>{{ r.timestamp }}</td>
        <td class="mono">
          {{ (r.response_snippet or '')[:120] }}{% if (r.response_snippet or '')|length > 120 %}...{% endif %}
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
